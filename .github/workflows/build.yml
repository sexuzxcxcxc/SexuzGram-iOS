name: Build SexuzGram iOS

on:
  workflow_dispatch:
  push:
    branches:
      - my-mod

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install bazel python3
          python3 -m pip install --upgrade pip setuptools

      - name: Generate Xcode project
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-config/my-config.json \
            --disableProvisioningProfiles

      - name: Build SexuzGram (Release)
        run: |
          xcodebuild -project Telegram.xcodeproj \
            -scheme Telegram \
            -configuration Release \
            -sdk iphoneos \
            BUILD_DIR=build

      - name: Archive IPA
        run: |
          mkdir -p build_output
          cp -r build/Release-iphoneos/Telegram.app build_output/SexuzGram.app
          cd build_output
          zip -r SexuzGram.ipa SexuzGram.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SexuzGram-IPA
          path: build_output/SexuzGram.ipa
